<meta charset="utf-8">
<title>GADAR Fig 2 — System Overview (ladder)</title>
<style>

<div class="wrap">
<svg width="1420" height="620" viewBox="0 0 1420 620" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff">

  <!-- ================= (a) INPUTS ================= -->
  <g font-size="12.5" text-anchor="middle">

  </g>
  <!-- tiny blocks glyph tying the s+G box to Figure 1's task -->
  <g>
    <rect x="212" y="398" width="17" height="16" rx="3" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.3"/>
    <rect x="212" y="381" width="17" height="16" rx="3" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.3"/>
    <rect x="235" y="398" width="17" height="16" rx="3" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.3"/>

    <text x="232" y="436" font-size="9.5" fill="#888" text-anchor="middle">e.g., Fig. 1</text>

  <path d="M 200 416 H 250 V 291 H 268" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="268" y1="285" x2="304" y2="285" stroke="#555" stroke-width="2.4" marker-end="url(#arr)"/>

  <text x="286" y="276" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">per state</text>

  <!-- ================= (b) THE LADDER OF DOMAIN CONDITIONING ================= -->
  <!-- rung 0: UNION (control) -->
  <rect x="310" y="60" width="500" height="96" rx="10" fill="#F4F6F7" stroke="#7F8C8D" stroke-width="1.8"/>
  <text x="330" y="86" font-size="14" font-weight="bold" fill="#566573">UNION&#160;&#160;(control)</text>
  <text x="520" y="86" font-size="11" font-style="italic" fill="#7F8C8D">the domain stays in the weights</text>
  <text x="330" y="112" font-size="11.5" fill="#566573">symbol-identity one-hots over the union of the training</text>
  <text x="330" y="128" font-size="11.5" fill="#566573">domains' vocabularies &#8212; multi-task, not domain-conditioned</text>
  <g>
    <rect x="742" y="96" width="13" height="13" fill="#7D3C98"/>
    <rect x="757" y="96" width="13" height="13" fill="#2C6FB5"/>
    <rect x="742" y="111" width="13" height="13" fill="#CB4335"/>
    <rect x="757" y="111" width="13" height="13" fill="#1E8449"/>
    <text x="762" y="140" font-size="9.5" fill="#7F8C8D" text-anchor="middle">|vocab|-sized</text>
  </g>

  <!-- +structural -->
  <line x1="345" y1="156" x2="345" y2="176" stroke="#2C6FB5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="171" font-size="11.5" font-weight="bold" fill="#2C6FB5">+ structural features (symbol-free)</text>

  <!-- rung 1: GADAR-DOM -->
  <rect x="310" y="178" width="500" height="96" rx="10" fill="#EFF6FD" stroke="#2C6FB5" stroke-width="1.8"/>
  <text x="330" y="204" font-size="14" font-weight="bold" fill="#2C6FB5">GADAR-DOM</text>
  <text x="520" y="204" font-size="11" font-style="italic" fill="#2471A3">what kind of thing is each symbol?</text>
  <text x="330" y="230" font-size="11.5" fill="#1F618D">node kind, arity, static / goal flags; argument positions</text>
  <text x="330" y="246" font-size="11.5" fill="#1F618D">as edge features &#8212; fixed widths, executable in any domain</text>
  <text x="762" y="230" font-size="9.5" fill="#2471A3" text-anchor="middle">no symbol</text>
  <text x="762" y="242" font-size="9.5" fill="#2471A3" text-anchor="middle">names</text>

  <!-- +lifted layer -->
  <line x1="345" y1="274" x2="345" y2="294" stroke="#7D3C98" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="289" font-size="11.5" font-weight="bold" fill="#7D3C98">+ lifted domain layer</text>

  <!-- rung 2: GADAR-BIND -->
  <rect x="310" y="296" width="500" height="96" rx="10" fill="#F7F2FB" stroke="#7D3C98" stroke-width="1.8"/>
  <text x="330" y="322" font-size="14" font-weight="bold" fill="#7D3C98">GADAR-BIND</text>
  <text x="520" y="322" font-size="11" font-style="italic" fill="#6C3483">what role does each symbol play in D?</text>
  <text x="330" y="348" font-size="11.5" fill="#5B2C6F">one symbol node per predicate; instantiation edges</text>
  <text x="330" y="364" font-size="11.5" fill="#5B2C6F">(literal&#8596;symbol); role edges (pre/add/del, arg&#8596;slot)</text>
  <g>
    <ellipse cx="742" cy="344" rx="20" ry="10" fill="#fff" stroke="#7D3C98" stroke-width="1.8"/>
    <rect x="770" y="352" width="30" height="14" rx="4" fill="#fff" stroke="#CB4335" stroke-width="1.6"/>
    <line x1="758" y1="350" x2="772" y2="356" stroke="#8E44AD" stroke-width="1.4"/>
    <ellipse cx="770" cy="326" rx="13" ry="8" fill="#FAE5A0" stroke="#B7950B"/>
    <line x1="757" y1="332" x2="750" y2="337" stroke="#E67E22" stroke-width="1.6" stroke-dasharray="2 3"/>
  </g>

  <!-- +binding -->
  <line x1="345" y1="392" x2="345" y2="412" stroke="#1E8449" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="407" font-size="11.5" font-weight="bold" fill="#1E8449">+ occurrence nodes + binding edges</text>

  <!-- rung 3: GADAR (full) -->
  <rect x="310" y="414" width="500" height="96" rx="10" fill="#E9F7EF" stroke="#1E8449" stroke-width="2.2"/>
  <text x="330" y="440" font-size="14" font-weight="bold" fill="#1E8449">GADAR</text>
  <text x="520" y="440" font-size="11" font-style="italic" fill="#196F3D">why is this ground action applicable?</text>
  <text x="330" y="466" font-size="11.5" fill="#145A32">occurrence nodes per schema literal; binding edges: object</text>
  <text x="330" y="482" font-size="11.5" fill="#145A32">at slot j &#8596; the precondition occurrence it satisfies</text>
  <text x="330" y="500" font-size="10.5" font-weight="bold" fill="#1E8449">= the two-layer graph of Figure 1</text>
  <g>
    <rect x="726" y="432" width="72" height="18" rx="5" fill="#F7F2FB" stroke="#C9B8E8"/>
    <rect x="726" y="474" width="72" height="18" rx="5" fill="#EFF6FD" stroke="#A9CCE3"/>
    <g stroke="#1E8449" stroke-width="1.9" stroke-dasharray="5 3">
      <line x1="742" y1="474" x2="752" y2="450"/>
      <line x1="774" y1="474" x2="782" y2="450"/>
    </g>
  </g>

  <!-- merge arrows into (c): every rung feeds the SAME encoder -->
  <g stroke="#555" stroke-width="1.8">
    <line x1="810" y1="108" x2="838" y2="108"/>
    <line x1="810" y1="226" x2="838" y2="226"/>
    <line x1="810" y1="344" x2="838" y2="344"/>
    <line x1="810" y1="462" x2="838" y2="462"/>
    <line x1="838" y1="108" x2="838" y2="462"/>
  </g>
  <line x1="838" y1="301" x2="862" y2="301" stroke="#555" stroke-width="2.4" marker-end="url(#arr)"/>

  <text x="838" y="94" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">one encoder</text>

  <!-- ================= (c) GNN ENCODER ================= -->
  <rect x="866" y="176" width="230" height="250" rx="16" fill="#FBFCFC" stroke="#7F8C8D" stroke-width="1.6"/>

    <text x="1072" y="372" fill="#333">e&#8342;&#8330;&#8321;</text>
  </g>
  <text x="981" y="410" font-size="11.5" fill="#555" text-anchor="middle">message passing + update layer, done L times</text>

  <text x="1118" y="290" font-size="13.5" font-style="italic" fill="#333" text-anchor="middle">g&#8343;</text>

  <g font-size="12" text-anchor="middle">

    <rect x="1144" y="278" width="182" height="40" rx="9" fill="#ffffff" stroke="#E67E22" stroke-width="2.4"/>

  <line x1="1235" y1="66" x2="1235" y2="92" stroke="#555" stroke-width="0" />
  <line x1="1235" y1="142" x2="1235" y2="182" stroke="#CA6F1E" stroke-width="1.9" marker-end="url(#arr)"/>
  <text x="1249" y="168" font-size="12.5" font-style="italic" fill="#CA6F1E">v&#7522;</text>
  <line x1="1235" y1="226" x2="1235" y2="242" stroke="#CA6F1E" stroke-width="1.9"/>
  <g stroke="#CA6F1E" stroke-width="1.9" stroke-dasharray="3 4">
    <line x1="1235" y1="242" x2="1235" y2="274" marker-end="url(#arr)"/>
  </g>
  <text x="1249" y="262" font-size="12.5" font-style="italic" fill="#CA6F1E">v&#8338;</text>

  <!-- GRU column -->
  <rect x="1344" y="186" width="60" height="132" rx="9" fill="#ffffff" stroke="#E67E22" stroke-width="2"/>
  <text x="1374" y="244" font-size="12" font-weight="bold" fill="#CA6F1E" text-anchor="middle">GRU</text>
  <text x="1374" y="260" font-size="11" fill="#CA6F1E" text-anchor="middle">decoder</text>
  <g stroke="#CA6F1E" stroke-width="1.2" opacity="0.7">

  <!-- output -->

  <g font-size="12.5" text-anchor="middle">
    <rect x="1130" y="348" width="210" height="42" rx="9" fill="#ffffff" stroke="#1E8449" stroke-width="2.4"/>
    <text x="1235" y="368" fill="#1E8449" font-weight="bold">Grounded action</text>
    <text x="1235" y="384" fill="#1E8449" font-weight="bold">A(O&#8321;, &#8230;, O&#8342;)&#160;&#160;k = arity(A)</text>
  </g>
  <text x="1235" y="418" font-size="11" fill="#555" text-anchor="middle">selections score schema- / object-node embeddings;</text>
  <text x="1235" y="432" font-size="11" fill="#555" text-anchor="middle">no layer sized by |A| or |O|</text>
  <rect x="1156" y="444" width="158" height="26" rx="7" fill="#F4F6F7" stroke="#B2BABB"/>
  <text x="1235" y="461" font-size="11.5" fill="#555" text-anchor="middle" font-weight="bold">unchanged from GABAR</text>

  <!-- ================= panel captions ================= -->
  <line x1="30" y1="560" x2="1400" y2="560" stroke="#EEEEEE"/>
  <g font-size="13.5" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="125"  y="584">(a) Inputs</text>
    <text x="560"  y="584">(b) A ladder of domain conditioning</text>
    <text x="981"  y="584">(c) GNN encoder</text>
    <text x="1235" y="584">(d) Grounded action extraction</text>
  </g>
  <g font-size="11.5" fill="#777" text-anchor="middle">
    <text x="125"  y="602">D moves from the weights into the input</text>
    <text x="560"  y="602">each system = the previous + one component; the suffix names what is missing</text>
    <text x="981"  y="602">L rounds (unchanged)</text>
    <text x="1235" y="602">autoregressive ranking (unchanged)</text>
  </g>
