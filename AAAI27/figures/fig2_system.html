<title>GADAR Fig 2 — System Overview (ladder)</title>

  <!-- ================= (a) INPUTS ================= -->

  <!-- tiny blocks glyph tying the s+G box to Figure 1's task -->
  <g>
    <rect x="212" y="398" width="17" height="16" rx="3" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.3"/>
    <rect x="212" y="381" width="17" height="16" rx="3" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.3"/>
    <rect x="235" y="398" width="17" height="16" rx="3" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.3"/>

  <path d="M 200 416 H 250 V 291 H 268" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="268" y1="285" x2="304" y2="285" stroke="#555" stroke-width="2.4" marker-end="url(#arr)"/>
  <text x="286" y="262" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">graph</text>
  <text x="286" y="276" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">per state</text>

  <!-- ================= (b) THE LADDER OF DOMAIN CONDITIONING ================= -->
  <!-- rung 0: UNION (control) -->
  <rect x="310" y="60" width="500" height="110" rx="10" fill="#F4F6F7" stroke="#7F8C8D" stroke-width="1.8"/>
  <text x="330" y="88" font-size="14" font-weight="bold" fill="#566573">UNION&#160;&#160;(control)</text>
  <text x="520" y="88" font-size="11" font-style="italic" fill="#7F8C8D">the domain stays in the weights</text>
  <text x="330" y="116" font-size="11.5" fill="#566573">symbol-identity one-hots over the union of the training</text>
  <text x="330" y="132" font-size="11.5" fill="#566573">domains' vocabularies &#8212; multi-task, not domain-conditioned;</text>
  <text x="330" y="148" font-size="11.5" fill="#566573">solves its training domains, transfers nothing</text>
  <g>
    <rect x="742" y="106" width="13" height="13" fill="#7D3C98"/>
    <rect x="757" y="106" width="13" height="13" fill="#2C6FB5"/>
    <rect x="742" y="121" width="13" height="13" fill="#CB4335"/>
    <rect x="757" y="121" width="13" height="13" fill="#1E8449"/>
    <text x="762" y="150" font-size="9.5" fill="#7F8C8D" text-anchor="middle">|vocab|-sized</text>
  </g>

  <!-- + structural + lifted + binding -->
  <line x1="345" y1="170" x2="345" y2="196" stroke="#7D3C98" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="180" font-size="11.5" font-weight="bold" fill="#7D3C98">+ symbol-free structural features</text>
  <text x="358" y="194" font-size="11.5" font-weight="bold" fill="#7D3C98">+ lifted domain layer + binding edges</text>

  <!-- rung 1: GADAR-BIND -->
  <rect x="310" y="200" width="500" height="126" rx="10" fill="#F7F2FB" stroke="#7D3C98" stroke-width="1.8"/>
  <text x="330" y="228" font-size="14" font-weight="bold" fill="#7D3C98">GADAR-BIND</text>
  <text x="520" y="228" font-size="11" font-style="italic" fill="#6C3483">what role does each symbol play in D &#8212;</text>
  <text x="520" y="242" font-size="11" font-style="italic" fill="#6C3483">and why is this ground action applicable?</text>
  <text x="330" y="262" font-size="11.5" fill="#5B2C6F">structural features (no symbol names, fixed widths); one</text>
  <text x="330" y="278" font-size="11.5" fill="#5B2C6F">symbol node per predicate + occurrence nodes per schema</text>
  <text x="330" y="294" font-size="11.5" fill="#5B2C6F">literal (pre/add/del, arg&#8596;slot); binding edges: object at</text>
  <text x="330" y="310" font-size="11.5" fill="#5B2C6F">slot j &#8596; the precondition occurrence it satisfies</text>
  <g>
    <ellipse cx="742" cy="262" rx="20" ry="10" fill="#fff" stroke="#7D3C98" stroke-width="1.8"/>
    <rect x="766" y="276" width="34" height="15" rx="4" fill="#fff" stroke="#CB4335" stroke-width="1.6"/>
    <ellipse cx="770" cy="248" rx="13" ry="8" fill="#FAE5A0" stroke="#B7950B"/>
    <line x1="762" y1="255" x2="778" y2="277" stroke="#1E8449" stroke-width="1.9" stroke-dasharray="5 3"/>
  </g>

  <!-- + chain layer -->
  <line x1="345" y1="326" x2="345" y2="352" stroke="#117A65" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="344" font-size="11.5" font-weight="bold" fill="#117A65">+ chain layer</text>

  <!-- rung 2: GADAR (full; the method) -->
  <rect x="310" y="356" width="500" height="154" rx="10" fill="#E8F8F3" stroke="#117A65" stroke-width="2.4"/>
  <text x="330" y="384" font-size="14" font-weight="bold" fill="#117A65">GADAR</text>
  <text x="520" y="384" font-size="11" font-style="italic" fill="#0E6655">how do schemas chain toward the goal?</text>
  <text x="330" y="408" font-size="11.5" fill="#0B5345">enables / threatens edges between occurrence nodes (A</text>
  <text x="330" y="424" font-size="11.5" fill="#0B5345">produces / destroys what B needs); per-schema goal distance;</text>
  <text x="330" y="440" font-size="11.5" fill="#0B5345">goal-relevant objects; grounded achieves-goal / deletes-true</text>
  <text x="330" y="456" font-size="11.5" fill="#0B5345">edges from applicable groundings; declared types compiled</text>
  <text x="330" y="472" font-size="11.5" fill="#0B5345">into unary static predicates</text>
  <text x="330" y="496" font-size="10.5" font-weight="bold" fill="#117A65">= the two-layer graph of Figure 1&#160;&#160;&#8212;&#160;&#160;the method</text>
  <g>
    <rect x="726" y="392" width="34" height="16" rx="5" fill="#fff" stroke="#CB4335" stroke-width="1.5"/>
    <rect x="766" y="392" width="34" height="16" rx="5" fill="#fff" stroke="#CB4335" stroke-width="1.5"/>
    <path d="M 743 390 C 750 378, 776 378, 783 390" fill="none" stroke="#16A085" stroke-width="2.2" stroke-dasharray="6 3"/>
    <ellipse cx="745" cy="430" rx="14" ry="9" fill="#FAE5A0" stroke="#B7950B"/>
    <ellipse cx="745" cy="430" rx="20" ry="14" fill="none" stroke="#16A085" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="762" y="460" font-size="9.5" fill="#117A65" text-anchor="middle">goal-aware</text>
  </g>

  <!-- merge arrows into (c): every rung feeds the SAME encoder -->
  <g stroke="#555" stroke-width="1.8">
    <line x1="810" y1="115" x2="838" y2="115"/>
    <line x1="810" y1="263" x2="838" y2="263"/>
    <line x1="810" y1="433" x2="838" y2="433"/>
    <line x1="838" y1="115" x2="838" y2="433"/>
  </g>
  <line x1="838" y1="301" x2="862" y2="301" stroke="#555" stroke-width="2.4" marker-end="url(#arr)"/>
  <text x="838" y="82" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">3 representations,</text>
  <text x="838" y="94" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">one encoder</text>

  <!-- ================= (c) GNN ENCODER ================= -->
  <rect x="866" y="176" width="230" height="250" rx="16" fill="#FBFCFC" stroke="#7F8C8D" stroke-width="1.6"/>

  <text x="1118" y="290" font-size="13.5" font-style="italic" fill="#333" text-anchor="middle">g&#8343;</text>

  <line x1="1235" y1="226" x2="1235" y2="242" stroke="#CA6F1E" stroke-width="1.9"/>
  <g stroke="#CA6F1E" stroke-width="1.9" stroke-dasharray="3 4">
    <line x1="1235" y1="242" x2="1235" y2="274" marker-end="url(#arr)"/>
  </g>
  <text x="1249" y="262" font-size="12.5" font-style="italic" fill="#CA6F1E">v&#8338;</text>

  <!-- GRU column -->
  <rect x="1344" y="186" width="60" height="132" rx="9" fill="#ffffff" stroke="#E67E22" stroke-width="2"/>
  <text x="1374" y="244" font-size="12" font-weight="bold" fill="#CA6F1E" text-anchor="middle">GRU</text>

    <text x="1235" y="384" fill="#1E8449" font-weight="bold">A(O&#8321;, &#8230;, O&#8342;)&#160;&#160;k = arity(A)</text>
  </g>
  <text x="1235" y="418" font-size="11" fill="#555" text-anchor="middle">selections score schema- / object-node embeddings;</text>
  <text x="1235" y="432" font-size="11" fill="#555" text-anchor="middle">no layer sized by |A| or |O|</text>
  <rect x="1156" y="444" width="158" height="26" rx="7" fill="#F4F6F7" stroke="#B2BABB"/>
  <text x="1235" y="461" font-size="11.5" fill="#555" text-anchor="middle" font-weight="bold">unchanged from GABAR</text>

  <!-- ================= panel captions ================= -->
  <line x1="30" y1="560" x2="1400" y2="560" stroke="#EEEEEE"/>
  <g font-size="13.5" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="125"  y="584">(a) Inputs</text>
    <text x="560"  y="584">(b) A ladder of domain conditioning</text>
    <text x="981"  y="584">(c) GNN encoder</text>
    <text x="1235" y="584">(d) Grounded action extraction</text>
  </g>
  <g font-size="11.5" fill="#777" text-anchor="middle">

    <text x="560"  y="602">each system = the previous + one component; the suffix names the last component added</text>
