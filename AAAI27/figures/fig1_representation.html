<meta charset="utf-8">
<title>GADAR Fig 1 — Representation</title>
<style>
  html,body{background:#ffffff;margin:0;padding:24px;font-family:Helvetica,Arial,sans-serif}
  .wrap{width:1420px;margin:0 auto;background:#ffffff}

<div class="wrap">
<svg width="1420" height="700" viewBox="0 0 1420 700" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff">
  <!-- ============ LEFT: start / goal mini states ============ -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <!-- start state -->
    <rect x="28"  y="168" width="36" height="34" rx="4" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.5"/>
    <text x="46" y="190" fill="#5D4037">O1</text>
    <rect x="84"  y="168" width="36" height="34" rx="4" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.5"/>
    <text x="102" y="190" fill="#5D4037">O2</text>
    <rect x="84"  y="130" width="36" height="34" rx="4" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.5"/>
    <text x="102" y="152" fill="#5D4037">O3</text>
    <rect x="18" y="204" width="112" height="8" rx="3" fill="#3B6FB5"/>
    <text x="74" y="232" font-weight="normal" fill="#333">Start State</text>
    <!-- goal state -->
    <rect x="152" y="168" width="36" height="34" rx="4" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.5"/>
    <text x="170" y="190" fill="#5D4037">O1</text>
    <rect x="152" y="130" width="36" height="34" rx="4" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.5"/>
    <text x="170" y="152" fill="#5D4037">O3</text>
    <rect x="208" y="168" width="36" height="34" rx="4" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.5"/>
    <text x="226" y="190" fill="#5D4037">O2</text>
    <rect x="142" y="204" width="112" height="8" rx="3" fill="#3B6FB5"/>
    <text x="198" y="232" font-weight="normal" fill="#333">Goal State</text>
    <!-- bracket -->
    <path d="M 262 120 q 14 0 14 16 v 60 q 0 14 12 14 q -12 0 -12 14 v 60 q 0 16 -14 16"
          fill="none" stroke="#555" stroke-width="2.5"/>
  </g>

  <!-- ============ LIFTED DOMAIN BAND ============ -->
  <rect x="300" y="24" width="800" height="262" rx="12" fill="#F7F2FB" stroke="#C9B8E8" stroke-width="1.5"/>
  <text x="316" y="48" font-size="14" font-weight="bold" fill="#6C3483">Lifted Domain Layer&#160;&#160;(built from D alone)</text>

  <!-- schema structure edges (schema -> occurrence) -->
  <g stroke="#B03A2E" stroke-width="1.3" opacity="0.85">
    <line x1="415" y1="100" x2="380" y2="152"/>
    <line x1="445" y1="100" x2="490" y2="152"/>
    <line x1="775" y1="100" x2="720" y2="152"/>
    <line x1="800" y1="100" x2="855" y2="152"/>
    <line x1="825" y1="100" x2="985" y2="152"/>
  </g>
  <!-- occurrence -> predicate symbol edges -->
  <g stroke="#8E44AD" stroke-width="1.3" opacity="0.8">
    <line x1="380" y1="178" x2="440" y2="228"/>
    <line x1="490" y1="178" x2="560" y2="228"/>
    <line x1="855" y1="178" x2="587" y2="234"/>
    <line x1="720" y1="178" x2="782" y2="228"/>
    <line x1="985" y1="178" x2="990" y2="228"/>
  </g>

  <!-- lifted schema nodes (blue OUTLINE) -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="370" y="70" width="120" height="30" rx="8" fill="#ffffff" stroke="#2C6FB5" stroke-width="2.5"/>
    <text x="430" y="90" fill="#2C6FB5">Pick-up (x)</text>
    <rect x="740" y="70" width="130" height="30" rx="8" fill="#ffffff" stroke="#2C6FB5" stroke-width="2.5"/>
    <text x="805" y="90" fill="#2C6FB5">Unstack (x, y)</text>
  </g>

  <!-- precondition / effect occurrence nodes (red OUTLINE) -->
  <g font-size="12" text-anchor="middle">
    <rect x="325" y="152" width="110" height="26" rx="7" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="380" y="169" fill="#CB4335">pre: clear (x)</text>
    <rect x="435" y="152" width="118" height="26" rx="7" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="494" y="169" fill="#CB4335">pre: ontable (x)</text>
    <rect x="662" y="152" width="112" height="26" rx="7" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="718" y="169" fill="#CB4335">pre: on (x, y)</text>
    <rect x="800" y="152" width="110" height="26" rx="7" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="855" y="169" fill="#CB4335">pre: clear (x)</text>
    <rect x="928" y="152" width="122" height="26" rx="7" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="989" y="169" fill="#CB4335">add: holding (x)</text>
  </g>

  <!-- predicate symbol nodes (purple OUTLINE ellipses) -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <ellipse cx="440" cy="245" rx="44" ry="17" fill="#ffffff" stroke="#7D3C98" stroke-width="2.2"/>
    <text x="440" y="249" fill="#7D3C98">ontable</text>
    <ellipse cx="565" cy="245" rx="40" ry="17" fill="#ffffff" stroke="#7D3C98" stroke-width="2.2"/>
    <text x="565" y="249" fill="#7D3C98">clear</text>
    <ellipse cx="790" cy="245" rx="34" ry="17" fill="#ffffff" stroke="#7D3C98" stroke-width="2.2"/>
    <text x="790" y="249" fill="#7D3C98">on</text>
    <ellipse cx="990" cy="245" rx="44" ry="17" fill="#ffffff" stroke="#7D3C98" stroke-width="2.2"/>
    <text x="990" y="249" fill="#7D3C98">holding</text>
  </g>

  <!-- ============ GROUND INSTANCE BAND ============ -->
  <rect x="300" y="330" width="800" height="300" rx="12" fill="#EFF6FD" stroke="#A9CCE3" stroke-width="1.5"/>
  <text x="316" y="354" font-size="14" font-weight="bold" fill="#1A5276">Ground Instance Layer&#160;&#160;(state s and goal G — as in GABAR)</text>

  <!-- action-object edges (navy) -->
  <g stroke="#1A5276" stroke-width="2.2">
    <line x1="430" y1="400" x2="430" y2="463"/>
    <line x1="785" y1="400" x2="722" y2="463"/>
    <line x1="825" y1="400" x2="878" y2="463"/>
  </g>
  <!-- slot labels on action-object edges -->
  <g font-size="11" font-style="italic" fill="#1A5276" text-anchor="middle">
    <text x="416" y="447">x</text>
    <text x="738" y="447">y</text>
    <text x="868" y="447">x</text>
  </g>
  <!-- literal-object edges (light blue) -->
  <g stroke="#5DADE2" stroke-width="1.6">
    <line x1="418" y1="497" x2="352" y2="566"/>
    <line x1="438" y1="497" x2="520" y2="566"/>
    <line x1="880" y1="497" x2="560" y2="570"/>
    <line x1="712" y1="497" x2="748" y2="566"/>
    <line x1="890" y1="497" x2="790" y2="566"/>
    <line x1="896" y1="497" x2="985" y2="566"/>
  </g>

  <!-- ground action nodes (blue FILLED) -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="380" y="370" width="100" height="30" rx="8" fill="#4A90D9" stroke="#2C6FB5" stroke-width="1.5"/>
    <text x="430" y="390" fill="#ffffff">Pick-up</text>
    <rect x="755" y="370" width="100" height="30" rx="8" fill="#4A90D9" stroke="#2C6FB5" stroke-width="1.5"/>
    <text x="805" y="390" fill="#ffffff">Unstack</text>
  </g>

  <!-- object nodes (yellow FILLED ellipses) -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <ellipse cx="430" cy="480" rx="26" ry="18" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="430" y="485" fill="#5D4037">O1</text>
    <ellipse cx="712" cy="480" rx="26" ry="18" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="712" y="485" fill="#5D4037">O2</text>
    <ellipse cx="885" cy="480" rx="26" ry="18" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="885" y="485" fill="#5D4037">O3</text>
  </g>

  <!-- ground literal nodes (red FILLED) -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="292" y="566" width="104" height="28" rx="7" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="344" y="585" fill="#ffffff">Clear (O1)</text>
    <rect x="452" y="566" width="130" height="28" rx="7" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="517" y="585" fill="#ffffff">G-On (O3, O1)</text>
    <rect x="692" y="566" width="118" height="28" rx="7" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="751" y="585" fill="#ffffff">On (O3, O2)</text>
    <rect x="932" y="566" width="104" height="28" rx="7" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="984" y="585" fill="#ffffff">Clear (O3)</text>
  </g>

  <!-- ============ BINDING EDGES (novel, green dashed) ============ -->
  <!-- diamond markers on action-object edges -->
  <g fill="#1E8449">
    <rect x="424" y="426" width="12" height="12" transform="rotate(45 430 432)"/>
    <rect x="749" y="426" width="12" height="12" transform="rotate(45 755 432)"/>
    <rect x="846" y="426" width="12" height="12" transform="rotate(45 852 432)"/>
  </g>
  <g stroke="#1E8449" stroke-width="2.6" stroke-dasharray="8 5" fill="none" opacity="0.95">
    <!-- Pick-up(x=O1) satisfies pre clear(x) -->
    <path d="M 430 424 C 400 330, 360 250, 372 182"/>
    <!-- Unstack(y=O2) satisfies pre on(x,y) -->
    <path d="M 755 424 C 740 350, 715 260, 716 182"/>
    <!-- Unstack(x=O3) satisfies pre on(x,y) and pre clear(x) -->
    <path d="M 852 424 C 840 350, 760 260, 735 182"/>
    <path d="M 852 424 C 856 340, 858 250, 856 182"/>
  </g>

  <!-- ============ INSTANTIATION EDGES (orange dotted) ============ -->
  <g stroke="#E67E22" stroke-width="2" stroke-dasharray="2 5" fill="none" opacity="0.9">
    <!-- Clear(O1) -> clear -->
    <path d="M 344 566 C 330 420, 470 300, 545 262"/>
    <!-- G-On(O3,O1) -> on -->
    <path d="M 560 566 C 600 430, 720 310, 776 263"/>
    <!-- On(O3,O2) -> on -->
    <path d="M 782 566 C 800 450, 795 330, 792 263"/>
    <!-- Clear(O3) -> clear -->
    <path d="M 1010 566 C 1080 380, 720 290, 605 254"/>
  </g>

  <!-- ============ LEGEND ============ -->
  <g font-size="12">
    <rect x="1120" y="24" width="286" height="606" rx="10" fill="#FBFBFB" stroke="#DDDDDD"/>
    <text x="1136" y="50" font-size="14" font-weight="bold" fill="#333">Legend</text>

    <text x="1136" y="76" font-weight="bold" fill="#666">Ground (filled)</text>
    <rect x="1136" y="86" width="56" height="22" rx="6" fill="#4A90D9" stroke="#2C6FB5"/>
    <text x="1202" y="101" fill="#333">Ground action</text>
    <rect x="1136" y="114" width="56" height="22" rx="6" fill="#CB4335" stroke="#943126"/>
    <text x="1202" y="129" fill="#333">Ground literal (G- = goal)</text>
    <ellipse cx="1164" cy="153" rx="26" ry="12" fill="#FAE5A0" stroke="#B7950B"/>
    <text x="1202" y="157" fill="#333">Object</text>

    <text x="1136" y="190" font-weight="bold" fill="#666">Lifted (outlined)</text>
    <rect x="1136" y="200" width="56" height="22" rx="6" fill="#fff" stroke="#2C6FB5" stroke-width="2.5"/>
    <text x="1202" y="215" fill="#333">Action schema</text>
    <rect x="1136" y="228" width="56" height="22" rx="6" fill="#fff" stroke="#CB4335" stroke-width="2"/>
    <text x="1202" y="243" fill="#333">Pre / add / del occurrence</text>
    <ellipse cx="1164" cy="267" rx="26" ry="12" fill="#fff" stroke="#7D3C98" stroke-width="2.2"/>
    <text x="1202" y="271" fill="#333">Predicate symbol</text>

    <text x="1136" y="304" font-weight="bold" fill="#666">Edges</text>
    <line x1="1136" y1="316" x2="1190" y2="316" stroke="#1A5276" stroke-width="2.2"/>
    <text x="1202" y="320" fill="#333">Action&#8211;object (slot x/y)</text>
    <line x1="1136" y1="340" x2="1190" y2="340" stroke="#5DADE2" stroke-width="1.6"/>
    <text x="1202" y="344" fill="#333">Literal&#8211;object</text>
    <line x1="1136" y1="364" x2="1190" y2="364" stroke="#B03A2E" stroke-width="1.3"/>
    <text x="1202" y="368" fill="#333">Schema structure</text>
    <line x1="1136" y1="388" x2="1190" y2="388" stroke="#8E44AD" stroke-width="1.3"/>
    <text x="1202" y="392" fill="#333">Occurrence&#8211;symbol</text>

    <line x1="1136" y1="418" x2="1190" y2="418" stroke="#1E8449" stroke-width="2.6" stroke-dasharray="8 5"/>
    <text x="1202" y="422" font-weight="bold" fill="#1E8449">Binding edge (ours)</text>
    <text x="1202" y="438" fill="#555" font-size="11">object at slot j satisfies this</text>
    <text x="1202" y="452" fill="#555" font-size="11">precondition occurrence</text>
    <line x1="1136" y1="476" x2="1190" y2="476" stroke="#E67E22" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="1202" y="480" font-weight="bold" fill="#E67E22">Instantiation edge (ours)</text>
    <text x="1202" y="496" fill="#555" font-size="11">ground literal &#8594; its</text>
    <text x="1202" y="510" fill="#555" font-size="11">predicate symbol</text>

    <rect x="1136" y="534" width="254" height="72" rx="8" fill="#F2FBF5" stroke="#A9DFBF"/>
    <text x="1148" y="556" font-size="11.5" fill="#1E8449" font-weight="bold">The binding layer expresses ground</text>
    <text x="1148" y="572" font-size="11.5" fill="#1E8449" font-weight="bold">applicability in the vocabulary of the</text>
    <text x="1148" y="588" font-size="11.5" fill="#1E8449" font-weight="bold">domain description D.</text>
  </g>

  <!-- footnote -->
  <text x="300" y="672" font-size="12" fill="#777">No feature encodes symbol identity: nodes carry structural features only (type, arity, static-ness, goal bit, argument positions) &#8212; the representation is invariant to renaming by construction.</text>
</svg>
