<meta charset="utf-8">
<title>GADAR Fig 1 — Representation</title>
<style>
  html,body{background:#ffffff;margin:0;padding:24px;font-family:Helvetica,Arial,sans-serif}
  .wrap{width:1420px;margin:0 auto;background:#ffffff}
</style>
<div class="wrap">
<svg width="1420" height="720" viewBox="0 0 1420 720" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff">

  <!-- ============ LEFT: start / goal states (full height, stacked) ============ -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <!-- start state -->
    <rect x="52"  y="150" width="44" height="42" rx="5" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="74" y="177" fill="#5D4037">O1</text>
    <rect x="122" y="150" width="44" height="42" rx="5" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="144" y="177" fill="#5D4037">O2</text>
    <rect x="122" y="104" width="44" height="42" rx="5" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="144" y="131" fill="#5D4037">O3</text>
    <rect x="40" y="194" width="140" height="9" rx="3" fill="#3B6FB5"/>
    <text x="110" y="228" font-size="14" font-weight="normal" fill="#333">Start State</text>
    <!-- goal state -->
    <rect x="52"  y="516" width="44" height="42" rx="5" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="74" y="543" fill="#5D4037">O1</text>
    <rect x="52"  y="470" width="44" height="42" rx="5" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="74" y="497" fill="#5D4037">O3</text>
    <rect x="122" y="516" width="44" height="42" rx="5" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="144" y="543" fill="#5D4037">O2</text>
    <rect x="40" y="560" width="140" height="9" rx="3" fill="#3B6FB5"/>
    <text x="110" y="594" font-size="14" font-weight="normal" fill="#333">Goal State</text>
  </g>
  <!-- brace spanning full height -->
  <path d="M 216 90 q 22 0 22 24 v 220 q 0 22 20 22 q -20 0 -20 22 v 220 q 0 24 -22 24"
        fill="none" stroke="#555" stroke-width="3"/>

  <!-- ============ LIFTED DOMAIN BAND ============ -->
  <rect x="290" y="40" width="790" height="262" rx="12" fill="#F7F2FB" stroke="#C9B8E8" stroke-width="1.5"/>
  <text x="306" y="66" font-size="14.5" font-weight="bold" fill="#6C3483">Lifted Domain Layer&#160;&#160;(built from D alone)</text>

  <!-- schema -> occurrence edges -->
  <g stroke="#B03A2E" stroke-width="1.4" opacity="0.85">
    <line x1="445" y1="105" x2="405" y2="160"/>
    <line x1="495" y1="105" x2="542" y2="160"/>
    <line x1="805" y1="105" x2="765" y2="160"/>
    <line x1="855" y1="105" x2="902" y2="160"/>
  </g>
  <!-- occurrence -> symbol edges (symmetric V into shared 'clear') -->
  <g stroke="#8E44AD" stroke-width="1.4" opacity="0.85">
    <line x1="405" y1="188" x2="620" y2="248"/>
    <line x1="902" y1="188" x2="680" y2="248"/>
    <line x1="542" y1="188" x2="545" y2="244"/>
    <line x1="765" y1="188" x2="795" y2="244"/>
  </g>

  <!-- schema nodes (blue OUTLINE) -->
  <g font-size="13.5" font-weight="bold" text-anchor="middle">
    <rect x="405" y="76" width="130" height="32" rx="9" fill="#ffffff" stroke="#2C6FB5" stroke-width="2.6"/>
    <text x="470" y="97" fill="#2C6FB5">Pick-up (x)</text>
    <rect x="762" y="76" width="136" height="32" rx="9" fill="#ffffff" stroke="#2C6FB5" stroke-width="2.6"/>
    <text x="830" y="97" fill="#2C6FB5">Unstack (x, y)</text>
  </g>

  <!-- occurrence nodes (red OUTLINE) -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="348" y="160" width="114" height="28" rx="8" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="405" y="179" fill="#CB4335">pre: clear (x)</text>
    <rect x="479" y="160" width="126" height="28" rx="8" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="542" y="179" fill="#CB4335">add: holding (x)</text>
    <rect x="708" y="160" width="114" height="28" rx="8" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="765" y="179" fill="#CB4335">pre: on (x, y)</text>
    <rect x="845" y="160" width="114" height="28" rx="8" fill="#ffffff" stroke="#CB4335" stroke-width="2"/>
    <text x="902" y="179" fill="#CB4335">pre: clear (x)</text>
  </g>
  <text x="1005" y="182" font-size="15" fill="#9B8AAE">&#8943;</text>

  <!-- predicate symbol nodes (purple OUTLINE) -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <ellipse cx="545" cy="262" rx="46" ry="18" fill="#ffffff" stroke="#7D3C98" stroke-width="2.3"/>
    <text x="545" y="267" fill="#7D3C98">holding</text>
    <ellipse cx="650" cy="262" rx="40" ry="18" fill="#ffffff" stroke="#7D3C98" stroke-width="2.3"/>
    <text x="650" y="267" fill="#7D3C98">clear</text>
    <ellipse cx="795" cy="262" rx="34" ry="18" fill="#ffffff" stroke="#7D3C98" stroke-width="2.3"/>
    <text x="795" y="267" fill="#7D3C98">on</text>
  </g>

  <!-- ============ GROUND INSTANCE BAND ============ -->
  <rect x="290" y="356" width="790" height="324" rx="12" fill="#EFF6FD" stroke="#A9CCE3" stroke-width="1.5"/>
  <text x="306" y="382" font-size="14.5" font-weight="bold" fill="#1A5276">Ground Instance Layer&#160;&#160;(state s and goal G &#8212; as in GABAR)</text>

  <!-- action-object edges (navy, vertical under schemas) -->
  <g stroke="#1A5276" stroke-width="2.4">
    <line x1="470" y1="428" x2="470" y2="492"/>
    <line x1="815" y1="428" x2="762" y2="492"/>
    <line x1="845" y1="428" x2="898" y2="492"/>
  </g>
  <g font-size="12" font-style="italic" fill="#1A5276" text-anchor="middle">
    <text x="455" y="470">x</text>
    <text x="775" y="476">y</text>
    <text x="888" y="476">x</text>
  </g>

  <!-- literal-object edges (light blue) -->
  <g stroke="#5DADE2" stroke-width="1.7">
    <line x1="456" y1="526" x2="392" y2="600"/>
    <line x1="482" y1="528" x2="540" y2="600"/>
    <line x1="884" y1="528" x2="576" y2="604"/>
    <line x1="748" y1="530" x2="754" y2="600"/>
    <line x1="890" y1="530" x2="788" y2="600"/>
    <line x1="908" y1="528" x2="956" y2="600"/>
  </g>

  <!-- ground action nodes (blue FILLED, aligned under lifted schemas) -->
  <g font-size="13.5" font-weight="bold" text-anchor="middle">
    <rect x="415" y="396" width="110" height="32" rx="9" fill="#4A90D9" stroke="#2C6FB5" stroke-width="1.5"/>
    <text x="470" y="417" fill="#ffffff">Pick-up</text>
    <rect x="775" y="396" width="110" height="32" rx="9" fill="#4A90D9" stroke="#2C6FB5" stroke-width="1.5"/>
    <text x="830" y="417" fill="#ffffff">Unstack</text>
  </g>

  <!-- object nodes (yellow FILLED) -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <ellipse cx="470" cy="512" rx="28" ry="20" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="470" y="517" fill="#5D4037">O1</text>
    <ellipse cx="750" cy="512" rx="28" ry="20" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="750" y="517" fill="#5D4037">O2</text>
    <ellipse cx="905" cy="512" rx="28" ry="20" fill="#FAE5A0" stroke="#B7950B" stroke-width="1.8"/>
    <text x="905" y="517" fill="#5D4037">O3</text>
  </g>

  <!-- ground literal nodes (red FILLED) -->
  <g font-size="12.5" font-weight="bold" text-anchor="middle">
    <rect x="330" y="600" width="110" height="30" rx="8" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="385" y="620" fill="#ffffff">Clear (O1)</text>
    <rect x="484" y="600" width="134" height="30" rx="8" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="551" y="620" fill="#ffffff">G-On (O3, O1)</text>
    <rect x="694" y="600" width="120" height="30" rx="8" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="754" y="620" fill="#ffffff">On (O3, O2)</text>
    <rect x="904" y="600" width="110" height="30" rx="8" fill="#CB4335" stroke="#943126" stroke-width="1.5"/>
    <text x="959" y="620" fill="#ffffff">Clear (O3)</text>
  </g>

  <!-- ============ BINDING EDGES (3 exemplars, near-vertical) ============ -->
  <g fill="#1E8449">
    <rect x="464" y="454" width="13" height="13" transform="rotate(45 470 460)"/>
    <rect x="782" y="454" width="13" height="13" transform="rotate(45 788 460)"/>
    <rect x="866" y="454" width="13" height="13" transform="rotate(45 872 460)"/>
  </g>
  <g stroke="#1E8449" stroke-width="2.8" stroke-dasharray="9 5" fill="none" opacity="0.95">
    <!-- Pick-up slot x = O1 satisfies pre clear(x): arc left of the Pick-up box -->
    <path d="M 466 452 C 360 410, 355 300, 398 196"/>
    <!-- Unstack slot y = O2 satisfies pre on(x,y): arc through the middle channel -->
    <path d="M 785 452 C 710 410, 700 300, 758 196"/>
    <!-- Unstack slot x = O3 satisfies pre clear(x): arc right of the Unstack box -->
    <path d="M 876 452 C 940 410, 940 300, 903 196"/>
  </g>

  <!-- ============ INSTANTIATION EDGE (1 exemplar) ============ -->
  <g stroke="#E67E22" stroke-width="2.4" stroke-dasharray="2 6" fill="none" opacity="0.95">
    <!-- G-On(O3,O1) -> on : arc through the middle channel -->
    <path d="M 610 598 C 660 480, 660 360, 780 288"/>
  </g>

  <!-- omitted-edges note -->
  <text x="306" y="696" font-size="12" fill="#888">One binding edge per slot and one instantiation edge shown (G-On links to the same symbol as On); every applicable slot binds to the occurrences it satisfies,</text>
  <text x="306" y="712" font-size="12" fill="#888">and every ground literal links to its predicate symbol. No feature encodes symbol identity &#8212; the representation is renaming-invariant by construction.</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="12.5">
    <rect x="1100" y="40" width="300" height="640" rx="10" fill="#FBFBFB" stroke="#DDDDDD"/>
    <text x="1118" y="68" font-size="14.5" font-weight="bold" fill="#333">Legend</text>

    <text x="1118" y="98" font-weight="bold" fill="#666">Ground &#8212; filled</text>
    <rect x="1118" y="110" width="58" height="24" rx="7" fill="#4A90D9" stroke="#2C6FB5"/>
    <text x="1188" y="126" fill="#333">Ground action</text>
    <rect x="1118" y="142" width="58" height="24" rx="7" fill="#CB4335" stroke="#943126"/>
    <text x="1188" y="158" fill="#333">Ground literal (G- = goal)</text>
    <ellipse cx="1147" cy="186" rx="28" ry="13" fill="#FAE5A0" stroke="#B7950B"/>
    <text x="1188" y="190" fill="#333">Object</text>

    <text x="1118" y="226" font-weight="bold" fill="#666">Lifted &#8212; outlined</text>
    <rect x="1118" y="238" width="58" height="24" rx="7" fill="#fff" stroke="#2C6FB5" stroke-width="2.6"/>
    <text x="1188" y="254" fill="#333">Action schema</text>
    <rect x="1118" y="270" width="58" height="24" rx="7" fill="#fff" stroke="#CB4335" stroke-width="2"/>
    <text x="1188" y="286" fill="#333">Pre / add / del occurrence</text>
    <ellipse cx="1147" cy="314" rx="28" ry="13" fill="#fff" stroke="#7D3C98" stroke-width="2.3"/>
    <text x="1188" y="318" fill="#333">Predicate symbol</text>

    <text x="1118" y="354" font-weight="bold" fill="#666">Edges</text>
    <line x1="1118" y1="368" x2="1174" y2="368" stroke="#1A5276" stroke-width="2.4"/>
    <text x="1188" y="372" fill="#333">Action&#8211;object (slot x / y)</text>
    <line x1="1118" y1="394" x2="1174" y2="394" stroke="#5DADE2" stroke-width="1.7"/>
    <text x="1188" y="398" fill="#333">Literal&#8211;object</text>
    <line x1="1118" y1="420" x2="1174" y2="420" stroke="#B03A2E" stroke-width="1.4"/>
    <text x="1188" y="424" fill="#333">Schema structure</text>
    <line x1="1118" y1="446" x2="1174" y2="446" stroke="#8E44AD" stroke-width="1.4"/>
    <text x="1188" y="450" fill="#333">Occurrence&#8211;symbol</text>

    <line x1="1118" y1="480" x2="1174" y2="480" stroke="#1E8449" stroke-width="2.8" stroke-dasharray="9 5"/>
    <text x="1188" y="484" font-weight="bold" fill="#1E8449">Binding edge (ours)</text>
    <text x="1188" y="501" fill="#555" font-size="11.5">object at slot j satisfies this</text>
    <text x="1188" y="516" fill="#555" font-size="11.5">precondition occurrence</text>
    <line x1="1118" y1="540" x2="1174" y2="540" stroke="#E67E22" stroke-width="2.4" stroke-dasharray="2 6"/>
    <text x="1188" y="544" font-weight="bold" fill="#E67E22">Instantiation edge (ours)</text>
    <text x="1188" y="561" fill="#555" font-size="11.5">ground literal &#8594; its</text>
    <text x="1188" y="576" fill="#555" font-size="11.5">predicate symbol</text>

    <rect x="1118" y="598" width="264" height="66" rx="8" fill="#F2FBF5" stroke="#A9DFBF"/>
    <text x="1132" y="620" font-size="12" fill="#1E8449" font-weight="bold">The binding layer expresses ground</text>
    <text x="1132" y="636" font-size="12" fill="#1E8449" font-weight="bold">applicability in the vocabulary of</text>
    <text x="1132" y="652" font-size="12" fill="#1E8449" font-weight="bold">the domain description D.</text>
  </g>
</svg>
