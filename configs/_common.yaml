# Shared base for every experiment in the suite. Experiment files point here
# via `base: _common.yaml` and contain only their delta (expid, domains,
# featurization, test_domains, + any overrides).
# Precedence: constants.py < this file < experiment file < CLI flags.
description: shared suite defaults

mode: train_test
epochs: 500
lr: 0.0005
batch_size: 64
num_workers: 4
gnn_rounds: 9
n_heads: 1
dropout: 0.0
attention_dropout: 0.0
weight_decay: 0.0
max_plan_length: 500
ablation: main
search_strat: greedy
num_train_problems: 0
num_test_problems: 200
all_problems: true
num_models_to_test: 1
# combined = the paper's stated (test-blind) selection rule; single metric
# also cuts the multi-hour test phase ~3x. See train_test_scripts/RUNBOOK.md.
test_model_metrics: combined
wandb: false
