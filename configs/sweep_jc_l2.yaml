# Regularization sweep, arm 3 of 5: weight decay only. See sweep_jc_base.yaml.
# weight_decay is part of the checkpoint key ('l2' in training_hyperparameters,
# main.py) so this arm gets its own model directory; it is defaulted away at
# 0.0, so the other arms keep the directory names they would have had.
description: Sweep arm - weight decay 1e-4
base: _common.yaml
expid: sweep_jc_l2
domains: manyblocks_ipcc_big,gripper_ipcc,miconic_ipcc,visitall_ipcc,grid_ipcc,logistics_ipcc,spanner_ipcc,rovers_ipcc
featurization: joint_chain
test_domains: manyblocks_ipcc_big:200,gripper_ipcc:173,miconic_ipcc:119,visitall_ipcc:50,grid_ipcc:48,logistics_ipcc:96,spanner_ipcc:96,rovers_ipcc:54
mode: train
epochs: 1000
seed: 11
checkpoint_every: 100
keep_checkpoints: 3
weight_decay: 0.0001
